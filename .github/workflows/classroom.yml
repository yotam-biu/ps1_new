name: Autograding Tests
on:
  push:
  workflow_dispatch:
  repository_dispatch:
permissions:
  contents: read
  checks: write
  actions: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Edit scope (5 points)
        id: edit-scope
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Edit scope
          command: python .tests/test_hello.py HelloTests.test_edit_scope
          timeout: 1
          max-score: 5
      - name: Exact output (5 points)
        id: output
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Exact output
          command: python .tests/test_hello.py HelloTests.test_output
          timeout: 1
          max-score: 5
      - name: Autograding Reporter
        if: always()
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EDIT-SCOPE_RESULTS: ${{ steps.edit-scope.outputs.result }}
          OUTPUT_RESULTS: ${{ steps.output.outputs.result }}
        with:
          runners: edit-scope,output
